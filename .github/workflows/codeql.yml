name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '37 2 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - dist/**

      - name: Summarize CodeQL findings for verification
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const files = fs.existsSync("results")
            ? fs.readdirSync("results").filter((name) => name.endsWith(".sarif")).map((name) => path.join("results", name))
            : [];
          const findings = [];
          for (const file of files) {
            const sarif = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const run of sarif.runs ?? []) {
              const rules = new Map((run.tool?.driver?.rules ?? []).map((r) => [r.id, r]));
              for (const result of run.results ?? []) {
                const rule = rules.get(result.ruleId);
                const location = result.locations?.[0]?.physicalLocation;
                const artifact = location?.artifactLocation?.uri ?? "?";
                const line = location?.region?.startLine ?? "?";
                const level = result.level ?? rule?.defaultConfiguration?.level ?? "?";
                findings.push({
                  tool: run.tool?.driver?.name ?? "?",
                  ruleId: result.ruleId ?? "?",
                  level,
                  file: artifact,
                  line,
                  message: String(result.message?.text ?? "").replace(/\s+/g, " ").trim()
                });
              }
            }
          }
          findings.sort((a,b) => (a.ruleId + "\0" + a.file + "\0" + a.line).localeCompare(b.ruleId + "\0" + b.file + "\0" + b.line));
          console.log(JSON.stringify({sarifFiles: files, findingCount: findings.length, findings}, null, 2));
          NODE

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
