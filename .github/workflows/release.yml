name: Release

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: workproof-runtime-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Determine release tag
        id: release
        shell: bash
        run: echo "tag=v${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - name: Verify release branch descends from current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor origin/main "${GITHUB_SHA}"; then
            echo "Release branch ${GITHUB_REF_NAME} is not based on the current main branch. Recreate it from current main before publishing."
            exit 1
          fi

      - name: Verify release branch immutability
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]; then
              echo "Release tag ${RELEASE_TAG} already points to ${TAG_COMMIT}; refusing to build from moved release branch ${GITHUB_SHA}."
              exit 1
            fi
          fi
      - name: Verify container base image is immutable
        run: node scripts/verify-container-base.js

      - name: Install dependencies
        run: npm ci

      - name: Wait for container verification gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            RUN_ID="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow container.yml --branch "${GITHUB_REF_NAME}" --limit 20 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == "'${GITHUB_SHA}'") | .databaseId' | head -n 1)"
            if [ -n "${RUN_ID}" ]; then
              STATUS="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json status --jq '.status')"
              CONCLUSION="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json conclusion --jq '.conclusion')"
              echo "Container verification run ${RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"
              if [ "${STATUS}" = "completed" ]; then
                if [ "${CONCLUSION}" != "success" ]; then
                  echo "Container verification gate failed for ${GITHUB_SHA}."
                  exit 1
                fi
                exit 0
              fi
            else
              echo "Waiting for container verification run on ${GITHUB_SHA}..."
            fi
            sleep 5
          done
          echo "Timed out waiting for container verification gate."
          exit 1


      - name: Full release verification
        run: npm run check

      - name: Build distribution files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf release-dist
          mkdir -p release-dist

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG#v}" != "${PACKAGE_VERSION}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}"
            exit 1
          fi
          PACKAGE_FILE="$(npm pack --silent --pack-destination release-dist)"
          SOURCE_FILE="workproof-runtime-${RELEASE_TAG}.tar.gz"
          BENCHMARK_FILE="workproof-benchmark-${RELEASE_TAG}.json"

          RELEASE_COMMIT="${GITHUB_SHA}"

          git archive --format=tar.gz --output="release-dist/${SOURCE_FILE}" "${RELEASE_COMMIT}"
          cp benchmark-result.json "release-dist/${BENCHMARK_FILE}"

          cat > release-dist/RELEASE-MANIFEST.txt <<EOF
          WorkProof Runtime ${RELEASE_TAG}
          Commit: ${RELEASE_COMMIT}
          Repository: ${GITHUB_REPOSITORY}
          Verification: npm run check
          Package: ${PACKAGE_FILE}
          Package version: ${PACKAGE_VERSION}
          Source bundle: ${SOURCE_FILE}
          Benchmark: ${BENCHMARK_FILE}
          EOF

          (cd release-dist && sha256sum -- * > SHA256SUMS.txt)
          cat release-dist/SHA256SUMS.txt

      - name: Packed CLI install smoke
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          PACKAGE_FILE="$(find release-dist -maxdepth 1 -type f -name "*.tgz" -printf "%f\n" | head -n 1)"
          test -n "${PACKAGE_FILE}"
          npm install --prefix "${SMOKE_DIR}" "./release-dist/${PACKAGE_FILE}"
          "${SMOKE_DIR}/node_modules/.bin/workctl" keygen "${SMOKE_DIR}/private.pem" "${SMOKE_DIR}/public.pem"
          test -s "${SMOKE_DIR}/private.pem"
          test -s "${SMOKE_DIR}/public.pem"
          "${SMOKE_DIR}/node_modules/.bin/workctl" trust-add "${SMOKE_DIR}/public.pem" "${SMOKE_DIR}/trust.json" "packed-cli-smoke"
          test -s "${SMOKE_DIR}/trust.json"
          node scripts/packed-control-plane-smoke.js "${SMOKE_DIR}/node_modules/operational-reality-core"
          echo "packed CLI and control-plane execution verified"
          node scripts/packed-mcp-smoke.js "${SMOKE_DIR}/node_modules/operational-reality-core"
          echo "packed MCP execution verified"
          node scripts/packed-a2a-smoke.js "${SMOKE_DIR}/node_modules/operational-reality-core"
          echo "packed A2A execution verified"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          NOTES_FILE="docs/RELEASE-${PACKAGE_VERSION}.md"
          EXPECTED_PRERELEASE="false"
          if [[ "${PACKAGE_VERSION}" == *-dev.* ]]; then
            EXPECTED_PRERELEASE="true"
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; reconciling publication state."
            RELEASE_ID="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq ".databaseId")"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f "prerelease=${EXPECTED_PRERELEASE}" -f "draft=false" >/dev/null
          else
            if [ "${EXPECTED_PRERELEASE}" = "true" ]; then
              gh release create "${RELEASE_TAG}"               --repo "${GITHUB_REPOSITORY}"               --target "${GITHUB_SHA}"               --title "WorkProof Runtime ${RELEASE_TAG}"               --prerelease               --notes-file "${NOTES_FILE}"               release-dist/*
            else
              gh release create "${RELEASE_TAG}"               --repo "${GITHUB_REPOSITORY}"               --target "${GITHUB_SHA}"               --title "WorkProof Runtime ${RELEASE_TAG}"               --notes-file "${NOTES_FILE}"               release-dist/*
            fi
          fi

      - name: Verify published release body coherence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" == *-dev.* ]]; then
            exit 0
          fi
          RELEASE_BODY="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body')"
          if grep -Eiq '(^|[^[:alpha:]])release[[:space:]]+candidate([^[:alpha:]]|$)' <<< "${RELEASE_BODY}"; then
            echo "Published stable release ${RELEASE_TAG} still contains stale candidate wording."
            exit 1
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          TARGET_COMMIT="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq '.targetCommitish')"
          test "${TARGET_COMMIT}" = "${TAG_COMMIT}"
          EXPECTED_PRERELEASE="false"
          if [[ "${RELEASE_TAG}" == *-dev.* ]]; then
            EXPECTED_PRERELEASE="true"
          fi
          ACTUAL_PRERELEASE="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq '.isPrerelease')"
          test "${ACTUAL_PRERELEASE}" = "${EXPECTED_PRERELEASE}"
          ASSET_COUNT="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')"
          test "${ASSET_COUNT}" = "5"
          ASSET_NAMES="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          for required in \
            "RELEASE-MANIFEST.txt" \
            "SHA256SUMS.txt" \
            "operational-reality-core-${RELEASE_TAG#v}.tgz" \
            "workproof-benchmark-${RELEASE_TAG}.json" \
            "workproof-runtime-${RELEASE_TAG}.tar.gz"; do
            echo "${ASSET_NAMES}" | grep -Fx "${required}" >/dev/null
          done

          rm -rf release-verify
          mkdir -p release-verify
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-verify
          (cd release-verify && sha256sum -c SHA256SUMS.txt)

          RELEASE_MANIFEST_COMMIT="$(awk -F': ' '/Commit:/ {print $2; exit}' release-verify/RELEASE-MANIFEST.txt | tr -d '\\r')"
          test "${RELEASE_MANIFEST_COMMIT}" = "${TAG_COMMIT}"

          node <<'NODE'
          const fs = require("fs");
          const tag = process.env.RELEASE_TAG;
          const result = JSON.parse(fs.readFileSync("release-verify/workproof-benchmark-" + tag + ".json", "utf8"));
          const metrics = result.metrics ?? {};
          if (!result.passed || !Array.isArray(result.results) || result.results.length !== 5) process.exit(1);
          if (!result.results.every((entry) => entry.status === "verified")) process.exit(1);
          if (metrics.verifiedCompletionRate !== 1 ||
              metrics.falseDoneCount !== 0 ||
              metrics.duplicateExternalEffectCount !== 0 ||
              metrics.ambiguousOutcomeResolvedCount !== 1 ||
              metrics.capabilitySubstitutionCount !== 1 ||
              metrics.evidenceCompleteRate !== 1 ||
              metrics.humanInterventionCount !== 0) process.exit(1);
          NODE
