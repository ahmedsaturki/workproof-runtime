name: Release

# Canonical release workflow: validates the published tag and its assets.

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

concurrency:
  group: workproof-runtime-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Determine release tag
        id: release
        shell: bash
        run: echo "tag=v${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Full release verification
        run: npm run check

      - name: Build distribution files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf release-dist
          mkdir -p release-dist

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG#v}" != "${PACKAGE_VERSION}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}"
            exit 1
          fi
          PACKAGE_FILE="$(npm pack --pack-destination release-dist | tail -n 1)"
          SOURCE_FILE="workproof-runtime-${RELEASE_TAG}.tar.gz"
          BENCHMARK_FILE="workproof-benchmark-${RELEASE_TAG}.json"

          RELEASE_COMMIT="${GITHUB_SHA}"
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            RELEASE_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
          fi

          git archive --format=tar.gz --output="release-dist/${SOURCE_FILE}" "${RELEASE_COMMIT}"
          cp benchmark-result.json "release-dist/${BENCHMARK_FILE}"

          cat > release-dist/RELEASE-MANIFEST.txt <<EOF
          WorkProof Runtime ${RELEASE_TAG}
          Commit: ${RELEASE_COMMIT}
          Repository: ${GITHUB_REPOSITORY}
          Verification: npm run check
          Package: ${PACKAGE_FILE}
          Package version: ${PACKAGE_VERSION}
          Source bundle: ${SOURCE_FILE}
          Benchmark: ${BENCHMARK_FILE}
          EOF

          (cd release-dist && sha256sum -- * > SHA256SUMS.txt)
          cat release-dist/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          NOTES_FILE="docs/RELEASE-${PACKAGE_VERSION}.md"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; continuing idempotently."
          else
            gh release create "${RELEASE_TAG}"               --repo "${GITHUB_REPOSITORY}"               --target "${GITHUB_SHA}"               --title "WorkProof Runtime ${RELEASE_TAG}"               --prerelease               --notes-file "${NOTES_FILE}"               release-dist/*
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          TARGET_COMMIT="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq '.targetCommitish')"
          test "${TARGET_COMMIT}" = "${TAG_COMMIT}"
          ASSET_COUNT="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')"
          test "${ASSET_COUNT}" = "5"
          ASSET_NAMES="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          for required in \
            "RELEASE-MANIFEST.txt" \
            "SHA256SUMS.txt" \
            "operational-reality-core-${RELEASE_TAG#v}.tgz" \
            "workproof-benchmark-${RELEASE_TAG}.json" \
            "workproof-runtime-${RELEASE_TAG}.tar.gz"; do
            echo "${ASSET_NAMES}" | grep -Fx "${required}" >/dev/null
          done

          rm -rf release-verify
          mkdir -p release-verify
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-verify
          (cd release-verify && sha256sum -c SHA256SUMS.txt)

          RELEASE_MANIFEST_COMMIT="$(awk -F': ' '/Commit:/ {print $2; exit}' release-verify/RELEASE-MANIFEST.txt | tr -d '\\r')"
          test "${RELEASE_MANIFEST_COMMIT}" = "${TAG_COMMIT}"

          node <<'NODE
          const fs = require("fs");
          const tag = process.env.RELEASE_TAG;
          const result = JSON.parse(fs.readFileSync("release-verify/workproof-benchmark-" + tag + ".json", "utf8"));
          const metrics = result.metrics ?? {};
          if (!result.passed || !Array.isArray(result.results) || result.results.length !== 5) process.exit(1);
          if (!result.results.every((entry) => entry.status === "verified")) process.exit(1);
          if (metrics.verifiedCompletionRate !== 1 ||
              metrics.falseDoneCount !== 0 ||
              metrics.duplicateExternalEffectCount !== 0 ||
              metrics.ambiguousOutcomeResolvedCount !== 1 ||
              metrics.capabilitySubstitutionCount !== 1 ||
              metrics.evidenceCompleteRate !== 1 ||
              metrics.humanInterventionCount !== 0) process.exit(1);
          NODE
