name: Release

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

concurrency:
  group: workproof-runtime-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Determine release tag
        id: release
        shell: bash
        run: echo "tag=v${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Full release verification
        run: npm run check

      - name: Build distribution files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf release-dist
          mkdir -p release-dist

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_FILE="$(npm pack --pack-destination release-dist | tail -n 1)"
          SOURCE_FILE="workproof-runtime-${RELEASE_TAG}.tar.gz"
          BENCHMARK_FILE="workproof-benchmark-${RELEASE_TAG}.json"

          git archive --format=tar.gz --output="release-dist/${SOURCE_FILE}" "${GITHUB_SHA}"
          cp benchmark-result.json "release-dist/${BENCHMARK_FILE}"

          cat > release-dist/RELEASE-MANIFEST.txt <<EOF
          WorkProof Runtime ${RELEASE_TAG}
          Commit: ${GITHUB_SHA}
          Repository: ${GITHUB_REPOSITORY}
          Verification: npm run check
          Package: ${PACKAGE_FILE}
          Package version: ${PACKAGE_VERSION}
          Source bundle: ${SOURCE_FILE}
          Benchmark: ${BENCHMARK_FILE}
          EOF

          (cd release-dist && sha256sum -- * > SHA256SUMS.txt)
          cat release-dist/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p 'require(\"./package.json\").version')"
          NOTES_FILE="docs/RELEASE-${PACKAGE_VERSION}.md"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; continuing idempotently."
          else
            gh release create "${RELEASE_TAG}"               --repo "${GITHUB_REPOSITORY}"               --target "${GITHUB_SHA}"               --title "WorkProof Runtime ${RELEASE_TAG}"               --prerelease               --notes-file "${NOTES_FILE}"               release-dist/*
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"