name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

concurrency:
  group: workproof-runtime-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify Chromium for browser acceptance tests
        run: |
          command -v chromium
          chromium --version
      - run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - run: node scripts/verify-source-tree.js
      - name: Build TypeScript
        run: npm run build
        timeout-minutes: 2
      - name: Run retention lifecycle suite
        run: node --test dist/test/retention.test.js
        timeout-minutes: 2
      - name: Run full unit and integration suite
        run: node --test dist/test/*.test.js
        timeout-minutes: 4
      - name: Run benchmark
        run: npm run benchmark
        timeout-minutes: 2
      - name: Run demo
        run: npm run demo
        timeout-minutes: 2
      - name: Verify CLI proof
        run: node dist/packages/cli/src/index.js verify mission-proof.json
        timeout-minutes: 1
      - name: Execute CLI mission
        run: node dist/packages/cli/src/index.js run examples/missions/research-local.json
        timeout-minutes: 2
      - name: Live GitHub integration smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run live-github-smoke
