services:
  workproof-studio:
    image: ghcr.io/ahmedsaturki/workproof-runtime:3.4.0-dev.4@sha256:1500730c2c2c9dc0d6da24ca2dd1de4948699e4f2956768d39107b91d753efba
    container_name: workproof-runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./work-runs:/data/work-runs
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8788"
      WORK_DIRECTORY: /data/work-runs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
