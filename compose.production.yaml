services:
  workproof-studio:
    image: ghcr.io/ahmedsaturki/workproof-runtime:3.8.11@sha256:9ad675ba540959c8ada0254f6c133c5fd51eaf02319fe8032b39738f34ea5088
    container_name: workproof-runtime
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./work-runs:/data/work-runs
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8788"
      WORK_DIRECTORY: /data/work-runs
      WORKPROOF_ALLOW_NON_LOOPBACK: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
